<!doctype html><meta charset="utf-8"><title>Sticky table browser test</title>
<link rel="stylesheet" href="/extension/content.css">
<style>
body{margin:0;font:16px Arial}.spacer{height:1200px}.players{overflow:auto;width:500px}table{width:1100px;table-layout:fixed}th,td{box-sizing:border-box;height:40px;border:1px solid #ccc}th{height:35px}td:nth-child(1),td:nth-child(2){width:40px}#results{position:fixed;right:0;top:0;background:white;z-index:5000}
</style>
<pre id="results">RUNNING</pre><div class="spacer"></div><div class="players"><table><colgroup><col style="width:40px"><col style="width:40px"><col style="width:180px"><col span="7" style="width:120px"></colgroup><thead><tr><th colspan="3">Player group</th><th colspan="7">Statistics</th></tr><tr><th>+</th><th>*</th><th>Players</th><th><button id="sort">PTS</button></th><th>A</th><th>B</th><th>C</th><th>D</th><th>E</th><th>F</th></tr></thead><tbody></tbody></table></div><div class="spacer"></div>
<script src="/extension/sticky.js"></script><script>
(async()=>{const out=document.querySelector('#results');try{
const table=document.querySelector('table'), scroller=table.parentElement;
for(let i=0;i<30;i++){const row=table.tBodies[0].insertRow();for(let j=0;j<10;j++){const cell=row.insertCell();cell.innerHTML=j===2?`<a id="playernote-${i}">Player ${i}</a>`:`${i}:${j}`;}}
let sorted=0;document.querySelector('#sort').addEventListener('click',()=>sorted++);
window.scrollTo(0,0);mountStickyPlayerTable(table);await new Promise(r=>setTimeout(r,80));
const floating=document.querySelector('.fsc-floating-header');
if(!floating || !floating.hidden)throw Error('header should start hidden');
window.scrollTo(0,1400);await new Promise(r=>setTimeout(r,80));
if(floating.hidden)throw Error('header did not appear');
scroller.scrollLeft=250;await new Promise(r=>setTimeout(r,80));
if(floating.scrollLeft!==scroller.scrollLeft)throw Error('horizontal scroll differs');
const name=table.tBodies[0].rows[0].cells[2].getBoundingClientRect();
if(Math.abs(name.left-(scroller.getBoundingClientRect().left+80))>2)throw Error('name column moved: '+name.left);
const orig=table.tHead.rows[1].cells[3].getBoundingClientRect();const cloned=floating.querySelectorAll('tr')[1].cells[3].getBoundingClientRect();
if(Math.abs(orig.left-cloned.left)>2)throw Error('header misaligned '+orig.left+' '+cloned.left);
floating.querySelector('button').click();if(sorted!==1)throw Error('sort not delegated');
window.scrollTo(0,3000);await new Promise(r=>setTimeout(r,80));if(!floating.hidden)throw Error('header remains after table');
const replacement=table.cloneNode(true);table.replaceWith(replacement);mountStickyPlayerTable(replacement);await new Promise(r=>setTimeout(r,80));
if(document.querySelectorAll('.fsc-floating-header').length!==1)throw Error('replacement leaked floating header');
replacement.tHead.rows[1].cells[4].textContent='Changed';mountStickyPlayerTable(replacement);await new Promise(r=>setTimeout(r,80));
if(!document.querySelector('.fsc-floating-header').textContent.includes('Changed'))throw Error('changed header not refreshed');
replacement.remove();mountStickyPlayerTable(null);if(document.querySelector('.fsc-floating-header'))throw Error('removed table leaked header');
out.textContent='PASS: vertical and horizontal scroll, alignment, sort and replacement';
}catch(e){out.textContent='FAIL: '+e.message;}})();
</script>
